/* JR 补习系统 · 共用设计 (shared design) — v1, 22-Nov-2026, Big C.
   RELATED: apps/design/jr_design.py (copies this file into every page between the JR-DESIGN markers; --check fails when a page is stale)
            apps/jr_html_common.py (Python report pages read this file directly) · apps/design/README.md (how to use it).
   Source of the look: JR 12-Oct-2026 「我选 D 黑板，暗色，标题用另一种字，短标题」 — blackboard palette, dark by choice,
   serif headings, short labels. Colour means STATE and nothing else (yellow = the one thing to press, orange = waiting for JR,
   green = done, red = stuck, blue = away / info).
   Themes: no attribute or data-theme="dark" = blackboard (JR's choice). data-theme="light" = chalk on paper (print, parents).
   data-theme="auto" = follow the phone. Every rule is wrapped in :where() so a page's own CSS always wins (specificity 0). */

:root, :root[data-theme="dark"] {
  --jr-bg:#14231d; --jr-surface:#1b2f27; --jr-surface-2:#22392f; --jr-sunk:#10201a; --jr-line:#2c4a3d; --jr-line-soft:rgba(240,239,230,.07);
  --jr-ink:#f0efe6; --jr-dim:#a9b8ae; --jr-faint:#6f8579;
  --jr-accent:#f3d25a; --jr-accent-ink:#1d1a05; --jr-accent-text:#f3d25a; --jr-accent-soft:rgba(243,210,90,.12);
  --jr-wait:#f08c4a; --jr-wait-soft:rgba(240,140,74,.13);
  --jr-done:#7fd3a0; --jr-done-soft:rgba(127,211,160,.14);
  --jr-stuck:#ef7d7d; --jr-stuck-soft:rgba(239,125,125,.13);
  --jr-away:#9fb4e8; --jr-away-soft:rgba(159,180,232,.14);
  --jr-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 28px -14px rgba(0,0,0,.65);
  --jr-grain:radial-gradient(rgba(240,239,230,.045) 1px, transparent 1.2px);
  color-scheme:dark;
}
:root[data-theme="light"] {
  --jr-bg:#f5f2e9; --jr-surface:#fffdf8; --jr-surface-2:#f0ebdd; --jr-sunk:#ebe5d5; --jr-line:#dcd4c0; --jr-line-soft:rgba(29,42,35,.07);
  --jr-ink:#1d2a23; --jr-dim:#59685f; --jr-faint:#8b968f;
  --jr-accent:#f0cb45; --jr-accent-ink:#1d1a05; --jr-accent-text:#7a5c00; --jr-accent-soft:rgba(240,203,69,.22);
  --jr-wait:#b4531a; --jr-wait-soft:rgba(180,83,26,.10);
  --jr-done:#1f7a45; --jr-done-soft:rgba(31,122,69,.10);
  --jr-stuck:#b3261e; --jr-stuck-soft:rgba(179,38,30,.09);
  --jr-away:#3d5aa8; --jr-away-soft:rgba(61,90,168,.10);
  --jr-shadow:0 1px 2px rgba(29,42,35,.06), 0 8px 24px -16px rgba(29,42,35,.35);
  --jr-grain:radial-gradient(rgba(29,42,35,.05) 1px, transparent 1.2px);
  color-scheme:light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --jr-bg:#f5f2e9; --jr-surface:#fffdf8; --jr-surface-2:#f0ebdd; --jr-sunk:#ebe5d5; --jr-line:#dcd4c0; --jr-line-soft:rgba(29,42,35,.07);
    --jr-ink:#1d2a23; --jr-dim:#59685f; --jr-faint:#8b968f;
    --jr-accent:#f0cb45; --jr-accent-ink:#1d1a05; --jr-accent-text:#7a5c00; --jr-accent-soft:rgba(240,203,69,.22);
    --jr-wait:#b4531a; --jr-wait-soft:rgba(180,83,26,.10);
    --jr-done:#1f7a45; --jr-done-soft:rgba(31,122,69,.10);
    --jr-stuck:#b3261e; --jr-stuck-soft:rgba(179,38,30,.09);
    --jr-away:#3d5aa8; --jr-away-soft:rgba(61,90,168,.10);
    --jr-shadow:0 1px 2px rgba(29,42,35,.06), 0 8px 24px -16px rgba(29,42,35,.35);
    --jr-grain:radial-gradient(rgba(29,42,35,.05) 1px, transparent 1.2px);
    color-scheme:light;
  }
}
:root {
  --jr-font:"Source Sans 3","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --jr-font-head:"Source Serif 4","Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --jr-r-sm:8px; --jr-r:14px; --jr-r-lg:20px; --jr-ease:cubic-bezier(.2,.8,.2,1);
  --jr-gap:14px; --jr-tap:48px;
}

/* ---------- base (only when the page has not said otherwise) ---------- */
:where(html) { -webkit-text-size-adjust:100%; }
:where(body) { margin:0; background-color:var(--jr-bg); background-image:var(--jr-grain); background-size:22px 22px; color:var(--jr-ink);
  font-family:var(--jr-font); font-size:16px; line-height:1.6; font-synthesis:none; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
:where(h1, h2, h3, .jr-h) { font-family:var(--jr-font-head); font-weight:700; letter-spacing:.01em; line-height:1.25; margin:0; }
:where(a) { color:var(--jr-accent-text); }
:where(:focus-visible) { outline:2px solid var(--jr-accent); outline-offset:2px; }
:where(*, *::before, *::after) { box-sizing:border-box; }

/* ---------- page frame ---------- */
:where(.jr-page) { max-width:760px; margin:0 auto; padding:20px 16px 56px; }
:where(.jr-page.wide) { max-width:1120px; }
:where(.jr-kicker) { font-family:var(--jr-font); font-size:13px; font-weight:600; letter-spacing:.14em; color:var(--jr-accent-text); text-transform:uppercase; }
:where(.jr-title) { font-family:var(--jr-font-head); font-size:clamp(26px, 6.4vw, 34px); font-weight:700; line-height:1.15; margin:4px 0 6px; }
:where(.jr-lede) { color:var(--jr-dim); font-size:16px; margin:0 0 18px; }
:where(.jr-rule) { height:2px; border:0; margin:10px 0 18px; background:linear-gradient(90deg, var(--jr-accent) 0 56px, var(--jr-line) 56px 100%); border-radius:2px; }

/* ---------- card ---------- */
:where(.jr-card) { background:var(--jr-surface); border:1px solid var(--jr-line); border-radius:var(--jr-r); padding:16px; margin:0 0 var(--jr-gap); box-shadow:var(--jr-shadow); }
:where(.jr-card.hero) { border-radius:var(--jr-r-lg); padding:18px; border-top:3px solid var(--jr-accent); }
:where(.jr-card.quiet) { background:transparent; box-shadow:none; border-style:dashed; }
:where(.jr-card-h) { display:flex; align-items:baseline; gap:10px; margin:0 0 10px; }
:where(.jr-card-h h2, .jr-card-h .jr-h) { font-size:19px; }
:where(.jr-card-h .jr-aside) { margin-left:auto; color:var(--jr-dim); font-size:13px; white-space:nowrap; }

/* ---------- state chips + dots (colour = state) ---------- */
:where(.jr-chip) { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; line-height:1; padding:6px 11px; border-radius:999px;
  background:var(--jr-surface-2); color:var(--jr-dim); border:1px solid var(--jr-line); white-space:nowrap; }
:where(.jr-chip.done) { background:var(--jr-done-soft); color:var(--jr-done); border-color:transparent; }
:where(.jr-chip.wait) { background:var(--jr-wait-soft); color:var(--jr-wait); border-color:transparent; }
:where(.jr-chip.stuck) { background:var(--jr-stuck-soft); color:var(--jr-stuck); border-color:transparent; }
:where(.jr-chip.away) { background:var(--jr-away-soft); color:var(--jr-away); border-color:transparent; }
:where(.jr-chip.go) { background:var(--jr-accent-soft); color:var(--jr-accent-text); border-color:transparent; }
:where(.jr-dot) { display:inline-block; width:10px; height:10px; border-radius:50%; background:currentColor; flex:none; }

/* ---------- buttons ---------- */
:where(.jr-btn) { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:var(--jr-tap); padding:12px 18px; border-radius:999px; border:0;
  font:700 17px/1.2 var(--jr-font); cursor:pointer; color:var(--jr-accent-ink); background:var(--jr-accent);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 6px 16px -8px rgba(243,210,90,.55); transition:transform .12s, filter .12s; text-decoration:none; }
:where(.jr-btn:active) { transform:scale(.97); }
:where(.jr-btn.ghost) { background:transparent; color:var(--jr-ink); border:1.5px solid var(--jr-line); box-shadow:none; font-weight:600; }
:where(.jr-btn:disabled) { opacity:.45; cursor:default; }

/* ---------- big numbers ---------- */
:where(.jr-stats) { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; }
:where(.jr-stat) { background:var(--jr-surface-2); border:1px solid var(--jr-line-soft); border-radius:12px; padding:12px; }
:where(.jr-stat .n) { font:700 30px/1 var(--jr-font-head); font-variant-numeric:tabular-nums; }
:where(.jr-stat .l) { color:var(--jr-dim); font-size:13px; margin-top:6px; }
:where(.jr-stat.done .n) { color:var(--jr-done); } :where(.jr-stat.wait .n) { color:var(--jr-wait); } :where(.jr-stat.stuck .n) { color:var(--jr-stuck); }

/* ---------- list rows ---------- */
:where(.jr-list) { list-style:none; margin:0; padding:0; }
:where(.jr-row) { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--jr-line-soft); }
:where(.jr-row:first-child) { border-top:0; }
:where(.jr-row .main) { flex:1; min-width:0; }
:where(.jr-row .sub) { display:block; color:var(--jr-dim); font-size:14px; }

/* ---------- meter bar (skill / mark) ---------- */
:where(.jr-meter) { display:grid; grid-template-columns:minmax(6em, 9em) 1fr auto; gap:10px; align-items:center; padding:6px 0; font-size:15px; }
:where(.jr-meter .track) { height:10px; border-radius:6px; background:var(--jr-sunk); overflow:hidden; }
:where(.jr-meter .fill) { display:block; height:100%; border-radius:6px; background:var(--jr-done); }
:where(.jr-meter .fill.mid) { background:var(--jr-accent); } :where(.jr-meter .fill.low) { background:var(--jr-wait); }
:where(.jr-meter .v) { color:var(--jr-dim); font-variant-numeric:tabular-nums; font-size:14px; }

/* ---------- table ---------- */
:where(.jr-table) { width:100%; border-collapse:separate; border-spacing:0; font-size:15px; }
:where(.jr-table th) { text-align:left; font-weight:600; font-size:13px; color:var(--jr-dim); padding:8px 10px; border-bottom:1px solid var(--jr-line); }
:where(.jr-table td) { padding:10px; border-bottom:1px solid var(--jr-line-soft); vertical-align:top; }
:where(.jr-table tr:last-child td) { border-bottom:0; }
:where(.jr-scroll) { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* ---------- notes, more-info, footer ---------- */
:where(.jr-note) { color:var(--jr-dim); font-size:14px; }
:where(.jr-callout) { border-left:4px solid var(--jr-accent); background:var(--jr-accent-soft); border-radius:0 12px 12px 0; padding:12px 14px; margin:12px 0; }
:where(.jr-callout.done) { border-color:var(--jr-done); background:var(--jr-done-soft); }
:where(.jr-callout.wait) { border-color:var(--jr-wait); background:var(--jr-wait-soft); }
:where(details.jr-more) { margin-top:10px; color:var(--jr-dim); font-size:13.5px; }
:where(details.jr-more > summary) { cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; color:var(--jr-dim); }
:where(details.jr-more > summary)::-webkit-details-marker { display:none; }
:where(details.jr-more > summary)::before { content:'ⓘ'; font-size:14px; }
:where(details.jr-more[open] > summary) { color:var(--jr-ink); margin-bottom:6px; }
:where(.jr-foot) { color:var(--jr-faint); font-size:13px; text-align:center; margin:28px 0 0; }

/* ---------- motion: calm, and none when the phone asks for none ---------- */
@keyframes jr-rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
:where(.jr-rise) { animation:jr-rise .5s var(--jr-ease) both; }
@media (prefers-reduced-motion: reduce) { :where(.jr-rise) { animation:none; } }

/* ---------- print: always chalk on paper ---------- */
@media print {
  :root { --jr-bg:#fff; --jr-surface:#fff; --jr-surface-2:#f6f3ea; --jr-sunk:#ece7da; --jr-line:#cfc8b5; --jr-line-soft:#e6e0d0; --jr-ink:#111; --jr-dim:#444; --jr-faint:#777;
          --jr-accent-text:#6b5100; --jr-done:#1f7a45; --jr-wait:#a24a14; --jr-stuck:#a11; --jr-shadow:none; --jr-grain:none; }
  :where(body) { background:#fff; }
  :where(.jr-card) { break-inside:avoid; }
  :where(.jr-noprint) { display:none !important; }
}
</style>

  .faces button.past { color:#5f7368; text-decoration:line-through; text-decoration-thickness:2px; background:#17271f; }
  .faces button.on { background:var(--go); color:var(--go-fg); border-color:var(--go); text-decoration:none; }
  .faceInfo { display:flex; gap:10px; align-items:center; margin-top:8px; color:var(--dust); font-size:16px; min-height:24px; }
  .faceInfo .thumbWait { width:64px; height:88px; border-radius:6px; background:rgba(255,255,255,.08); flex:0 0 auto; }
  .faceInfo img { width:64px; height:88px; object-fit:cover; object-position:top; border-radius:6px; background:#fff; flex:0 0 auto; }
  .seg { display:flex; border:1.5px solid var(--line); border-radius:40px; overflow:hidden; }
  .seg button { flex:1; border-radius:0; background:transparent; color:var(--chalk); font-size:19px; padding:14px 6px; }
  .seg button.on { background:var(--go); color:var(--go-fg); }
  .saveRow { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .saveRow button { border-radius:40px; padding:16px 6px; font-size:19px; }
  .saveRow button.one { grid-column:1 / -1; }
  .ok { margin:12px 0; padding:14px; border-radius:12px; background:var(--done-soft); border-left:5px solid var(--done); color:var(--done); font-size:19px; font-weight:700; line-height:1.4; }
  .ok.badBox { background:#3a2323; border-left-color:var(--bad); color:var(--bad); }
  .ok button.link { color:var(--chalk); text-decoration:underline; display:block; padding:8px 0 0; font-size:18px; }
  .ask { margin:12px 0; padding:14px; border-radius:12px; border:2px solid var(--go); background:#2e2a12; font-size:18px; font-weight:600; line-height:1.4; }
  .note { color:var(--dust); font-size:15px; margin:4px 0 0; }
  .sect { color:var(--go); font-size:17px; font-weight:700; margin:20px 0 0; }
  .recBtns { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .recBtns button { background:transparent; color:var(--chalk); border:1.5px solid var(--line); padding:13px 4px; font-size:19px; }
  .recBtns button.on { background:var(--go); color:var(--go-fg); border-color:var(--go); }
  /* ---------- shoot: 1 photo › 2 paper › 3 upload ---------- */
  .steps { display:flex; gap:6px; margin:4px 0 14px; }
  .steps button { flex:1; font-size:16px; padding:9px 4px; border-radius:30px; background:transparent; color:var(--dust); border:1.5px solid var(--line); font-weight:600; }
  .steps button.on { background:var(--slate2); color:var(--chalk); border-color:var(--go); }
  .steps button.did { color:var(--done); }
  .shootBtns { display:flex; flex-direction:column; gap:10px; }
  .btn.big, button.big { font-size:24px; padding:22px 16px; flex:none; border-radius:18px; }
  .btn.small { font-size:17px; padding:12px; flex:none; }
  .pages { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
  .page { position:relative; background:var(--slate); border-radius:10px; padding:5px; border:2px solid transparent; }
  .page.bad { border-color:var(--bad); }
  .page img { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top; background:#fff; border-radius:6px; }
  .page .n { position:absolute; left:9px; top:9px; background:rgba(20,35,29,.85); color:var(--chalk); font-size:15px; font-weight:700; padding:2px 8px; border-radius:10px; }
  .page .w { display:block; color:var(--bad); font-size:14px; font-weight:700; margin-top:4px; text-align:center; }
  .who { margin:6px 0 14px; padding:16px; border-radius:16px; background:var(--slate); border:1.5px solid var(--line); }
  .who .big { font-size:26px; font-weight:800; line-height:1.3; }
  .who .big b { color:var(--go); }
  .pkList { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .pkList .wide { grid-column:1 / -1; }
  .pkHead { grid-column:1 / -1; font-size:17px; color:var(--go); font-weight:700; margin-top:8px; }
  .pkHead.soft { color:var(--dust); font-weight:400; font-size:16px; margin-top:0; }
  button.pk { min-height:54px; padding:10px 12px; font-size:19px; flex:none; line-height:1.3; word-break:break-all; background:transparent; color:var(--chalk); border:1.5px solid var(--line); font-weight:600; text-align:left; }
  button.pk.on { background:var(--go); color:var(--go-fg); border-color:var(--go); }
  button.pk.two { white-space:pre-line; font-size:18px; }
  .links a { display:block; color:var(--go); margin:8px 0; font-size:17px; word-break:break-all; }
  #msg { position:fixed; left:12px; right:12px; bottom:96px; z-index:35; max-width:536px; margin:0 auto; padding:12px 14px; border-radius:12px; background:#0e1a15;
         border:1.5px solid var(--line); color:var(--chalk); font-size:17px; white-space:pre-line; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  #msg.ok { border-color:var(--done); color:var(--done); } #msg.bad { border-color:var(--bad); color:var(--bad); }
  #msg:empty { display:none; }
  #ver { margin:28px 0 0; text-align:center; color:var(--dust); font-size:15px; }
  /* ---------- slide-up panel (设计灵感 16-Oct #深色面板从底部滑上来) ---------- */
  #sheetBg { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.55); opacity:0; transition:opacity .3s; }
  #sheetBg.on { opacity:1; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:71; max-height:86vh; overflow:auto; background:var(--slate); border-top:2px solid var(--go);
           border-radius:22px 22px 0 0; padding:20px 16px; padding-bottom:max(20px, env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .55s cubic-bezier(.2,.9,.25,1); }
  #sheet.on { transform:none; }
  #sheet .in { max-width:560px; margin:0 auto; }
  #sheetTitle { font-size:22px; font-weight:800; margin:0 0 6px; }
  #sheetText { color:var(--dust); font-size:17px; margin:0 0 14px; white-space:pre-line; }
  #sheetBtns { display:flex; flex-direction:column; gap:8px; }
  #sheetBtns button { flex:none; }
  /* ---------- full-screen photo viewer: pinch, double-tap, swipe ---------- */
  #vw { position:fixed; inset:0; z-index:60; background:#000; touch-action:none; overflow:hidden; }
  #vwImg { position:absolute; left:0; top:0; transform-origin:0 0; user-select:none; -webkit-user-drag:none; max-width:none; }
  #vwTop, #vwBot { position:absolute; left:0; right:0; display:flex; gap:8px; align-items:center; padding:10px 12px; background:rgba(20,35,29,.88); z-index:2; }
  #vwTop { top:0; padding-top:max(10px, env(safe-area-inset-top)); }
  #vwBot { bottom:0; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  #vwTitle { flex:1; font-size:19px; font-weight:700; }
  #vwTitle i { color:var(--bad); font-style:normal; }
  #vwTop button { flex:0 0 auto; padding:10px 16px; font-size:18px; }
  #vwBot button { flex:1; font-size:17px; padding:12px 4px; background:transparent; color:var(--chalk); border:1.5px solid var(--line); }
  #vwBot button.del { color:var(--bad); border-color:#6b3434; }
  #vwHint { position:absolute; left:0; right:0; bottom:84px; text-align:center; color:#cfd8d2; font-size:15px; pointer-events:none; text-shadow:0 1px 3px #000; }
  /* corner editor + live camera (unchanged from v12, palette only) */
  .layer { position:fixed; inset:0; background:#000; z-index:65; display:flex; flex-direction:column; }
  .layer video, .layer canvas { flex:1; width:100%; min-height:0; object-fit:contain; touch-action:none; }
  .bar { display:flex; gap:10px; padding:12px; background:#0b0e11; align-items:center; }
  .bar button { flex:1; }
  .cam { position:fixed; inset:0; background:#000; z-index:80; overflow:hidden; user-select:none; -webkit-user-select:none; }
  .cam video, .cam canvas { position:absolute; left:0; top:0; width:100%; height:100%; }
  .cam video { object-fit:contain; background:#000; }
  .cam canvas { pointer-events:none; }
  .cam { --camOk:#7fd3a0; --camBad:#ef7d7d; font-family:"Source Sans 3","Noto Sans SC",system-ui,sans-serif; }
  #camTop { position:absolute; left:0; right:0; top:0; display:flex; gap:6px; padding:8px 10px; padding-top:max(8px, env(safe-area-inset-top)); background:rgba(20,35,29,.82); }
  #camTop button { padding:7px 4px; font-size:15px; font-weight:600; background:#1b2f27; color:#f0efe6; border:1px solid #2f4a3e; border-radius:9px; }
  #camTop button.on { background:#f3d25a; color:#14231d; border-color:#f3d25a; }
  /* v13 (测试报告 设计怪 8): 「自动拍」 is a switch, not a choice like 一页 / 两页: a dot, never the same yellow block */
  #camTop #autoBtn { background:#1b2f27; color:#f0efe6; border-color:#2f4a3e; }
  #camTop #autoBtn.on { color:var(--camOk); border-color:var(--camOk); background:#1b2f27; }
  #camStatus { position:absolute; left:10px; right:58px; top:calc(max(8px, env(safe-area-inset-top)) + 50px); height:34px; display:flex; align-items:center; gap:8px; padding:0 12px; border-radius:17px;
    background:rgba(20,35,29,.86); border:2px solid var(--camBad); color:#f0efe6; font-size:16px; font-weight:600; pointer-events:none; white-space:nowrap; overflow:hidden; }
  #camStatus i { flex:0 0 auto; width:10px; height:10px; border-radius:50%; background:var(--camBad); }
  #camStatus.ok { border-color:var(--camOk); } #camStatus.ok i { background:var(--camOk); }
  #camBottom { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:10px; padding:14px; padding-bottom:max(14px, env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.65)); }
  #camBottom .side { flex:1; display:flex; }
  #camBottom .side.r { justify-content:flex-end; }
  #camDone { flex:0 0 auto; padding:14px 22px; background:rgba(20,35,29,.85); color:var(--chalk); border:1px solid var(--line); }
  #camShot { flex:0 0 auto; width:84px; height:84px; padding:0; border-radius:50%; border:6px solid #fff; background:var(--go); }
  #camCount { color:#fff; font-size:20px; font-weight:700; text-shadow:0 1px 4px #000; }
  #camFlash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { #sheet, #sheetBg { transition:none; } }

  /* ---------- 22-Nov v14e 新样子 (JR 22-Nov「没有很高级」): looks only — no element, id, text or tap changed ---------- */
  main { padding-top:20px; }
  .kicker { color:var(--go); font-size:14px; letter-spacing:.12em; font-weight:700; }
  h1 { font-size:32px; letter-spacing:.01em; margin:4px 0 14px; }
  h1::after { content:''; display:block; width:56px; height:3px; margin-top:10px; border-radius:2px; background:var(--go); }
  h2 { font-size:26px; letter-spacing:.01em; }
  button, .btn { box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 8px 18px -10px rgba(243,210,90,.6); transition:transform .12s, background-color .2s; }
  button:active, .btn:active { transform:scale(.97); }
  button.ghost, .btn.ghost { background:var(--slate); box-shadow:none; }
  button.link { box-shadow:none; color:var(--dust); }
  button.gone { box-shadow:none; }
  /* home: each class is a card; the left edge says its state (green = pressed, orange = not yet) */
  .tt { border-top:0; display:grid; gap:10px; margin-top:8px; }
  .ttRow { position:relative; overflow:hidden; padding:15px 14px 15px 20px; border:1px solid var(--line); border-radius:16px; background:var(--slate);
           box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 24px -16px rgba(0,0,0,.7); }
  .ttRow::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--line); }
  .ttRow:has(.chip.did)::before { background:var(--done); }
  .ttRow:has(.chip.wait)::before { background:var(--wait); }
  .ttRow .nm { font-family:var(--jr-font-head); font-size:22px; font-weight:700; }
  .ttRow .nm small { font-family:var(--jr-font); }
  .chip { font-size:15px; padding:7px 13px; }
  .chip.did { background:var(--jr-done-soft); }
  .chip.wait { border:0; background:var(--jr-wait-soft); }
  .moreBtns { gap:10px; margin-top:18px; }
  .moreBtns button { border-radius:14px; border:1px solid var(--line); font-weight:600; }
  .card { border:1px solid var(--line); box-shadow:0 10px 24px -16px rgba(0,0,0,.7); }
  .card.warn { background:var(--jr-accent-soft); border-color:rgba(243,210,90,.55); }
  /* class page */
  .sect { display:flex; align-items:center; gap:10px; font-size:14px; letter-spacing:.12em; margin:24px 0 2px; }
  .sect::after { content:''; flex:1; height:1px; background:var(--line); }
  .paper { border:1px solid var(--line); box-shadow:0 10px 24px -16px rgba(0,0,0,.7); }
  .paper.open { border-color:var(--go); box-shadow:0 0 0 1px var(--go), 0 14px 30px -18px rgba(0,0,0,.8); }
  .pHead { font-family:var(--jr-font-head); font-size:20px; }
  .pHead .st, .pHead .ph { font-family:var(--jr-font); }
  .stage { border-radius:12px; box-shadow:0 8px 20px -12px rgba(0,0,0,.8); }
  .stage .cap { backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .faces { gap:6px; }
  .faces button { border-radius:10px; box-shadow:none; font-family:var(--jr-font-head); }
  .faces button.on { box-shadow:0 0 0 3px var(--jr-accent-soft); }
  .seg { border-color:var(--line); background:var(--board); }
  .seg button, .reasons button, .recBtns button, button.pk, .steps button { box-shadow:none; }
  .saveRow button { font-weight:800; }
  .ok { border-radius:14px; }
  .willSave { border:1px solid var(--line); }
  /* shoot + bottom bar */
  .dock { background:linear-gradient(rgba(20,35,29,0), rgba(20,35,29,.92) 38%); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .dock button { box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 12px 28px -10px rgba(243,210,90,.55); letter-spacing:.04em; }
  .who { border:1px solid var(--line); border-top:3px solid var(--go); }
  .page { border-color:transparent; box-shadow:0 8px 18px -12px rgba(0,0,0,.8); }
  #sheet { box-shadow:0 -20px 50px -20px rgba(0,0,0,.8); }
  #sheetTitle { font-family:var(--jr-font-head); }
  #ver { color:var(--jr-faint); font-size:14px; }
  @media (prefers-reduced-motion: reduce) { button, .btn { transition:none; } }
</style>
</head>
<body>
<main>
  <section id="pinBox" class="hidden">
    <h1>JR 扫描</h1>
    <p>请输入家里的密码：</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div class="row" style="margin-top:10px"><button id="pinGo">进入</button></div>
  </section>

  <section id="app" class="hidden">
    <!-- ===== HOME: today's timetable ===== -->
    <div id="vHome">
      <div class="kicker" id="homeDay"></div>
      <h1 id="homeTitle">今天的课</h1>
      <button id="homeBackToday" type="button" class="link hidden">← 回到今天</button>
      <div id="unkBox" class="card warn hidden"></div>
      <div id="tt" class="tt"></div>
      <p id="ttEmpty" class="sub hidden" style="margin-top:12px">这一天时间表没有课。</p>
      <div class="moreBtns">
        <button id="otherDay" type="button" class="ghost">补按别天的课</button>
        <button id="extraCls" type="button" class="ghost">时间表没有的班</button>
        <button id="typeLine" type="button" class="ghost">✍ 别的（我打字）</button>
        <button id="recentBtn" type="button" class="ghost">最近存的文件</button>
      </div>
      <div id="textBox" class="card hidden">
        <h3>打一行字（哪一班、做到哪里……）</h3>
        <input id="progText" type="text" maxlength="300" autocomplete="off">
        <div class="row" style="margin-top:10px"><button id="textCancel" type="button" class="ghost">不打了</button><button id="textSave" type="button">存起来</button></div>
      </div>
      <div id="recentBox" class="card hidden"><h3>最近存的文件</h3><div id="recent" class="links hint">（还没有）</div></div>
    </div>

    <!-- ===== CLASS: how far did this class get ===== -->
    <div id="vClass" class="hidden">
      <button id="clsBack" type="button" class="link">← 今天的课表</button>
      <h2 id="clsTitle"></h2>
      <p id="clsSub" class="sub"></p>
      <div id="clsDone"></div>
      <div id="clsList"></div>
    </div>

    <!-- ===== SHOOT: 1 photo › 2 paper › 3 upload, one step per screen ===== -->
    <div id="vShoot" class="hidden">
      <button id="shootBack" type="button" class="link">← 今天的课表</button>
      <div class="steps"><button id="st1" type="button">① 拍照</button><button id="st2" type="button">② 哪份卷</button><button id="st3" type="button">③ 上传</button></div>

      <div id="s1">
        <div class="shootBtns">
          <button id="liveBtn" type="button" class="big hidden">📷 开相机拍</button>
          <label class="btn big" id="camBtn">📷 拍一页<input id="cam" type="file" accept="image/*" capture="environment" class="hidden"></label>
          <label class="btn ghost small">🖼 从相册选（可以一次选很多张）<input id="gallery" type="file" accept="image/*" multiple class="hidden"></label>
        </div>
        <div id="camWhy" class="card hidden"><span id="camWhyText" style="white-space:pre-line"></span>
          <div class="links"><a id="camWhyLink" href="https://jrchan-lab.github.io/jr-scan/" target="_blank" rel="noopener">https://jrchan-lab.github.io/jr-scan/</a></div>
          <div class="row"><button id="camWhyCopy" class="ghost">📋 复制网址</button></div>
        </div>
        <p id="pagesHint" class="hint hidden">点一张照片 = 看大图（两指放大、左右滑）。</p>
        <div id="pages" class="pages"></div>
        <button id="clear" type="button" class="ghost hidden" style="width:100%">🗑 全部清掉（照片和名字）</button>
      </div>

      <div id="s2" class="hidden">
        <div id="pickBox">
          <p id="pkTitle" class="q"></p>
          <div id="pkList" class="pkList"></div>
          <input id="pupilType" type="text" class="hidden" placeholder="打学生名字，例如 陈小明" autocomplete="off" style="margin-top:10px">
          <span class="hidden"><select id="paperPick"></select><select id="whoPick"></select></span>
        </div>
        <div id="typeBox" class="hidden">
          <p>卷子 / 书的名字：<span class="hint">会记住，下一份不用再打。</span></p>
          <input id="name" type="text">
          <p style="margin-top:10px">学生名字：<span class="hint">扫学生的卷才填；扫书不用填。</span></p>
          <input id="pupil" type="text" placeholder="例如 陈小明">
        </div>
      </div>

      <div id="s3" class="hidden">
        <div class="who"><div class="big" id="whoBig"></div><div class="sub" id="whoPaper" style="margin:6px 0 0"></div></div>
        <button id="make" type="button" class="big" style="width:100%" disabled>☁ 上传</button>
        <p id="uploadState" class="hint" role="status" aria-live="polite">还没拍照片。</p>
        <div id="links" class="links"></div>
        <div id="afterUp" class="hidden" style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
          <button id="nextPupil" type="button" class="big">📷 下一个学生（同一份卷）</button>
          <button id="finishUp" type="button" class="ghost">完成，回课表</button>
        </div>
        <p id="pickName" class="hint fname"></p>
      </div>
      <span class="hidden"><input id="autocut" type="checkbox"><input id="split" type="checkbox"><input id="enhance" type="checkbox"></span>
    </div>
  </section>
  <p id="ver"></p>
</main>

<div class="dock hidden" id="dock"><div class="in"><button id="dockBtn" type="button">📷 拍卷子</button></div></div>
<div id="msg" role="status" aria-live="polite"></div>

<!-- slide-up panel: every question the page asks (no browser confirm / alert boxes) -->
<div id="sheetBg" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"><div class="in"><p id="sheetTitle"></p><p id="sheetText"></p><div id="sheetBtns"></div></div></div>

<!-- full-screen photo -->
<div id="vw" class="hidden">
  <img id="vwImg" alt="">
  <div id="vwTop"><span id="vwTitle"></span><button id="vwClose" type="button">✕ 关</button></div>
  <div id="vwHint">两指放大 · 点两下放大 · 左右滑看别页</div>
  <div id="vwBot"><button id="vwRot" type="button">↻ 转</button><button id="vwCut" type="button">✂ 调边</button><button id="vwLeft" type="button">⬅ 往前</button><button id="vwDel" type="button" class="del">🗑 删掉这页</button></div>
</div>

<!-- corner editor layer -->
<div id="edLayer" class="layer hidden">
  <canvas id="edCanvas"></canvas>
  <div class="bar">
    <button id="edCancel" class="ghost">取消</button>
    <button id="edFull" class="ghost">整张</button>
    <button id="edSave">✂ 切好</button>
  </div>
</div>

<!-- live camera layer -->
<div id="camLayer" class="cam hidden">
  <video id="camVideo" playsinline autoplay muted></video>
  <canvas id="camOverlay"></canvas>
  <div id="camTop">
    <button id="modeOne" class="on">一页</button>
    <button id="modeTwo">两页（书）</button>

<script>
(function () {
  // Big C fills in JR's Apps Script web-app address (https://script.google.com/macros/s/.../exec) before the page is published on GitHub Pages.
  // Inside Apps Script itself this stays unused (google.script.run is used instead).
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyxbS6gZNiC37tzVZgdoM4eJLfdWZAKOU5rGPMp-D9XRwd8DTkhQL4Braa3lYnddZ3e1A/exec';   // filled in only in the published copy (apps/scanner/publish_jr_scan.py); the address never goes into this repo
  var VERSION = '第十四版 e · 22-Nov-2026 · 新样子';
  var onGoogle = typeof google !== 'undefined' && google.script && google.script.run;
  var hasServer = !!(onGoogle || EXEC_URL);     // false = nothing to save to: the PDF is only downloaded
  var $ = function (id) { return document.getElementById(id); };
  var pages = [];            // {orig: dataURL, w, h, quad: [[x,y]x4] in orig px or null, cut: dataURL|null, rot: 0..3, warn}
  var pageSerial = 0, lastSavedSignature = '', lastUploadedName = '', uploadBusy = false, uploadUnknown = false;
  function uploadSignature_() {
    return JSON.stringify([$('name').value.trim(), $('pupil').value.trim(), $('paperPick').value, $('whoPick').value, pages.map(function(p) {
      return [p.uid, p.rot, p.quad, p.cut ? p.cut.length : 0];
    })]);
  }
  function uploaded_() { return !!lastSavedSignature && uploadSignature_() === lastSavedSignature; }
  function uploadStateText_(count, busy, saved, name, uncertain) {
    if (busy) return '正在上传，请等一等，不要再按。';
    if (!count) return '还没拍照片。';
    if (saved) return 'Drive 收到了：' + name + '。（电脑整理、小V核卷是后面的事。）';
    if (uncertain) return '上传结果还不确定，照片还在。先看「最近存的文件」，不要再上传一次。';
    return '';
  }
  function syncUploadState_() {
    var saved = uploaded_(), n = pages.length;
    $('uploadState').textContent = uploadStateText_(n, uploadBusy, saved, lastUploadedName, uploadUnknown);
    var m = $('make');            // v13 (测试报告 最痛 5): after a good upload the button turns grey 「✔ 已上传」 until a photo or the name changes
    m.textContent = uploadBusy ? '上传中……' : saved ? '✔ 已上传' : '☁ 上传 ' + n + ' 张';
    m.className = 'big' + (saved ? ' gone' : '');
    m.disabled = uploadBusy || saved || !n;
    show('afterUp', saved && !uploadBusy);
  }
  window.addEventListener('beforeunload', function(e) {
    if (pages.length && uploadSignature_() !== lastSavedSignature) { e.preventDefault(); e.returnValue = ''; }
  });
  $('name').addEventListener('input', function () { syncUploadState_(); drawShoot(); });
  $('pupil').addEventListener('input', function () { syncUploadState_(); drawShoot(); });

  // ---------- helpers shared by every screen ----------
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WD = '日一二三四五六';
  var GRADES = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'F1', 'F2', 'F3'];
  var SUBJ = { MA: '数学', SC: '科学', EN: '英文', BM: '马来文', HW: '华文', SEJ: '历史' };
  var XSUBJ = ['华文', '马来文', '英文', '数学', '科学', '历史', '作文'];
  var MULTI = '多人', TYPE = '__type__', UNDO_MS = 10 * 60 * 1000;
  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  var msgTimer = 0;
  function say(text, kind) {          // v13 (合并通知): ONE message place for the whole app, just above the bottom button
    var m = $('msg'); clearTimeout(msgTimer);
    m.textContent = text || ''; m.className = kind || '';
    if (text && !kind) msgTimer = setTimeout(function () { if (m.textContent === text) m.textContent = ''; }, 4000);
  }
  function ymd(d) { var p = function (x) { return ('0' + x).slice(-2); }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }
  function dayShort(iso) { var m = /^\d{4}-(\d\d)-(\d\d)$/.exec(iso || ''); return m ? (+m[2]) + '-' + MON[+m[1] - 1] : (iso || ''); }
  function wdOf(iso) { var t = Date.parse(iso + 'T00:00:00Z'); return isNaN(t) ? '' : WD[new Date(t).getUTCDay()]; }
  function gradesOf(p) { return (p.cls || '').match(/[SF][1-6]/g) || []; }      // a joint class (五六年级 / 中二中三) shows under each of its grades
  function gradeName(g) { return ((PD || {}).class_names || {})[g] || g; }
  function subjectOf(p) {
    var pre = (p.paper_id || '').split('-')[0];
    if (p.kind === '回头考') return '';
    if (SUBJ[pre]) return SUBJ[pre];
    var m = /(数学|科学|英文|马来文|华文|历史|作文)/.exec(p.short || ''); return m ? m[1] : '';
  }
  function labelOf(p) { return (subjectOf(p) + ' ' + p.kind + ' ' + dayShort(p.date)).replace(/^ +/, ''); }
  function paperName(p) {   // subject + the first word after it, e.g. 历史 Bab1 · 科学 第2课 科学室规则
    var sub = subjectOf(p), t = p.short || '', k = sub ? t.indexOf(sub) : -1;
    var rest = (k >= 0 ? t.slice(k + sub.length) : t.replace(/^(早上|上午|下午|晚上|\d+点)\s+/, '')).replace(/^[（(][^）)]*[）)]/, '').trim(), tok = rest.split(/\s+/).filter(Boolean);
    var name = (tok[0] || '').replace(/第\d+堂.*$/, '');
    if (/^第\d+课$/.test(name) && tok[1]) name += ' ' + tok[1];
    return (sub + ' ' + name.slice(0, 16)).trim();
  }
  function btn(text, cls, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = cls || ''; b.textContent = text; b.onclick = fn; return b; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function newReq() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function stamp() {
    var d = new Date(), p = function (x) { return ('0' + x).slice(-2); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());   // seconds: two saves in one minute get different names
  }
  function run(fn, args) {
    if (onGoogle) return new Promise(function (ok, bad) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { bad(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    });
    if (!EXEC_URL) return Promise.reject(new Error('这个网页还没有连上 Google（服务器地址没填）。'));
    // No custom headers => text/plain => no CORS preflight; Code.gs doPost() answers {ok,result} or {ok,error}.
    return fetch(EXEC_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.text(); }, function () { throw new Error('连不上服务器，请检查网络。'); })
      .then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error('服务器的回复看不懂（可能没有设成「任何人都能用」）。'); }
        if (j && j.ok) return j.result;
        throw new Error((j && j.error) || '服务器出错了。');
      });
  }
  function loadImage(src) {
    return new Promise(function (ok, bad) { var im = new Image(); im.onload = function () { ok(im); }; im.onerror = bad; im.src = src; });
  }

  // ---------- slide-up panel: every question (v13: no browser confirm / alert boxes; 设计灵感 16-Oct 深色面板从底部滑上来) ----------
  var sheetDone = null;
  function sheet(title, text, choices) {     // choices = [{label, val, cls}] -> Promise(val | null)
    if (sheetDone) sheetDone(null);
    $('sheetTitle').textContent = title; $('sheetText').textContent = text || ''; show('sheetText', !!text);
    var box = $('sheetBtns'); box.innerHTML = '';
    return new Promise(function (ok) {
      sheetDone = function (v) { sheetDone = null; $('sheet').classList.remove('on'); $('sheetBg').classList.remove('on'); setTimeout(function () { if (!sheetDone) { show('sheet', false); show('sheetBg', false); } }, 350); ok(v); };
      choices.forEach(function (c) { box.appendChild(btn(c.label, c.cls || '', function () { if (sheetDone) sheetDone(c.val); })); });
      show('sheet', true); show('sheetBg', true);
      requestAnimationFrame(function () { requestAnimationFrame(function () { $('sheet').classList.add('on'); $('sheetBg').classList.add('on'); }); });
    });
  }
  $('sheetBg').onclick = function () { if (sheetDone) sheetDone(null); };

  // ---------- data: _今天的卷.json (Code.gs todayPapers <- laptop apps/scanner/today_papers.py) ----------
  // File name = <paper_id>-<回头考|小测|加练>-<pupil or 多人>-<yyyymmdd>-原图.pdf; eval/reading/intake.py reads it back (NEW_NAME).
  var PD = null, PROGP = [], TODAY = null;      // PD = the whole json; PROGP = papers + old_papers (paperPick and the class page index into it)
  var PRESSED = {}, TAGGED = {};                // this phone, this visit: 'date|class_id' pressed · unknown photos already told
  function setProgData(data) {
    var any = data && ((data.papers || []).length || (data.old_papers || []).length || (data.classes_today || []).length || (data.days || []).length);
    PD = any ? data : null;
    TODAY = PD && (PD.papers || []).length ? PD : null;
    PROGP = PD ? (PD.papers || []).concat(PD.old_papers || []) : [];
    if (PD && !PD.days) PD.days = [{ date: PD.date, wd: '', classes: (PD.classes_today || []).map(function (c) {   // a laptop list from before v12
      var id = c.grades.join('') + '-' + c.subject + '-?'; return { id: id, name: c.grades.map(gradeName).join('') + ' · ' + c.subject, grades: c.grades, subject: c.subject, sure: c.sure }; }) }];
  }
  function dayObj(date) { return ((PD && PD.days) || []).filter(function (d) { return d.date === date; })[0] || { date: date, wd: wdOf(date), classes: [] }; }
  function clsShort(c) {       // 「三年级英文」 + 「下午班」
    var parts = (c.name || '').split(' · ');
    return { title: parts.slice(0, 2).join(''), sess: parts.slice(2).join(' ') };
  }
  function clsName(id) {       // a class id -> its name from any day in the list ('?' = an old press with no class)
    if (id === '?') return '不知道哪班';
    for (var i = 0; i < ((PD && PD.days) || []).length; i++) for (var j = 0; j < PD.days[i].classes.length; j++) if (PD.days[i].classes[j].id === id) { var s = clsShort(PD.days[i].classes[j]); return s.title + s.sess; }
    return id.split('-').slice(0, 2).join('');
  }
  // v13 (规则乱 3): the face pressed is DONE: 「做完到第 6 面」 = faces 1-6 are finished.
  function progLine(pr) { return pr ? '做完到第 ' + pr.face + ' 面' + (pr.quiz === '全部做完' ? ' · 整份做完' : pr.quiz === '没做' ? ' · 小测没做' : pr.quiz === '做了' ? ' · 小测做了' : '') + '（' + dayShort(pr.date) + '）' : ''; }
  function shared(p, c) { var g = gradesOf(p).filter(function (x) { return c.grades.indexOf(x) >= 0; }); return g.length ? g : c.grades.slice(); }
  function pgPapers(c, d) {     // {day, olds, others, recs} for class c on lesson day d (v12, unchanged)
    var seen = {}, day = [], olds = [], others = [], recs = [];
    PROGP.forEach(function (p, i) {
      if (!gradesOf(p).some(function (g) { return c.grades.indexOf(g) >= 0; }) || p.date > d) return;
      if (/^JX-/.test(p.paper_id) && !/集训/.test(c.subject + (c.name || ''))) return;   // 20-Nov v14d (JR「2年级没有晚上班的，解决」): 两兄弟集训的卷不是正常班的卷
      if (p.kind === '回头考') { if (p.date === d && !seen['r' + p.paper_id]) { seen['r' + p.paper_id] = 1; recs.push({ i: i, p: p }); } return; }
      if (!p.faces || !p.faces.length || seen[p.paper_id]) return;
      seen[p.paper_id] = 1;
      var o = { i: i, p: p }, s = subjectOf(p), mine = (p.prog || {})[c.id];
      var essay = c.subject === '作文' && (p.cls === c.grades.join('') || /作文|写作|WRITING|KARANGAN/i.test((p.short || '') + p.paper_id));
      if (s && s !== c.subject && !essay) { if (!(mine && mine.quiz === '全部做完')) others.push(o); return; }   // 作文班 writes in 英文 / 马来文 (JR 2-Nov, 10-Nov)
      if (p.date === d) day.push(o);
      else if (!(mine && mine.quiz === '全部做完')) olds.push(o);
    });
    var newest = function (a, b) { return a.p.date < b.p.date ? 1 : a.p.date > b.p.date ? -1 : a.i - b.i; };
    olds.sort(newest); others.sort(newest);
    return { day: day, olds: olds, others: others, recs: recs };
  }
  var NT_LOCAL = {};             // 19-Nov v14: 「今天没有上到」 pressed on this phone: 'date|class_id' -> reason ('' = taken back)
  function notTaught(c, date) {
    var k = date + '|' + c.id; if (k in NT_LOCAL) return NT_LOCAL[k];
    var hit = ((PD && PD.not_taught) || []).filter(function (x) { return x.date === date && x.class_id === c.id; }).pop();
    return hit ? hit.reason || '没写原因' : '';
  }
  function pressedOn(c, date) {
    if (PRESSED[date + '|' + c.id]) return true;
    return PROGP.some(function (p) { var r = (p.prog || {})[c.id]; return r && r.date === date; });
  }

  // ---------- screens ----------
  var view = 'home', homeDate = '';
  function go(v) {
    if (v === 'home' && pendingPD && pickFree()) { var d = pendingPD; pendingPD = null; view = 'home'; applyFresh(d); return; }   // v13.1: the fresh list waits for a safe moment
    view = v; show('vHome', v === 'home'); show('vClass', v === 'class'); show('vShoot', v === 'shoot');
    if (v === 'home') drawHome(); else if (v === 'class') drawClass(); else drawShoot();
    drawDock(); window.scrollTo(0, 0);
  }
  function drawDock() {
    var b = $('dockBtn'), n = pages.length, left = n && !uploaded_();
    show('dock', !!PD || view === 'shoot' || !TODAY);
    if (view === 'home') { b.textContent = '📷 拍卷子' + (left ? '（' + n + ' 张还没上传）' : ''); b.disabled = false; }
    else if (view === 'class') { b.textContent = '📷 拍这一班的卷' + (left ? '（' + n + ' 张）' : ''); b.disabled = false; }
    else if (sStep === 1) { b.textContent = n ? '下一步：哪份卷 →' : '先拍照'; b.disabled = !n; }
    else if (sStep === 2) { b.textContent = '下一步：上传 →'; b.disabled = !pickReady(); }
    else show('dock', false);
  }
  $('dockBtn').onclick = function () {
    if (view === 'home') { shootCls = null; shootDate = homeDate; openShoot(); }
    else if (view === 'class') { shootCls = cc; shootDate = ccDate; openShoot(); }
    else if (sStep === 1 && pages.length) { sStep = 2; drawShoot(); window.scrollTo(0, 0); }
    else if (sStep === 2 && pickReady()) { sStep = 3; drawShoot(); window.scrollTo(0, 0); }
  };

  // ===== HOME = today's timetable (样子 B, JR 16-Nov) =====
  function drawHome() {
    if (!PD) {
      $('homeDay').textContent = ''; $('homeTitle').textContent = 'JR 扫描'; $('tt').innerHTML = '';
      show('ttEmpty', false); show('otherDay', false); show('extraCls', false); show('typeLine', false); show('homeBackToday', false); show('unkBox', false);
      return;
    }
    if (!homeDate) homeDate = PD.date;
    var d = dayObj(homeDate), today = homeDate === PD.date, wd = d.wd || wdOf(homeDate);
    $('homeDay').textContent = dayShort(homeDate) + ' 星期' + wd;
    $('homeTitle').textContent = (today ? '今天 ' : dayShort(homeDate) + ' ') + d.classes.length + ' 班';
    show('homeBackToday', !today); show('otherDay', true); show('extraCls', true); show('typeLine', true);
    var box = $('tt'); box.innerHTML = '';
    d.classes.forEach(function (c) {
      var s = clsShort(c), did = pressedOn(c, homeDate);
      var r = btn('', 'ttRow', function () { openClass(c, homeDate); });
      var nm = el('span', 'nm', s.title); nm.appendChild(el('small', '', s.sess + (c.sure ? '' : ' · 时间表没核')));
      var nt = notTaught(c, homeDate);
      r.appendChild(nm); r.appendChild(el('span', 'chip ' + (did ? 'did' : nt ? 'dim' : 'wait'), did ? '按了 ✔' : nt ? '没上到' : '还没按'));
      box.appendChild(r);
    });
    show('ttEmpty', !d.classes.length);
    drawUnknown();
  }
  $('homeBackToday').onclick = function () { homeDate = PD.date; drawHome(); };
  $('otherDay').onclick = function () {
    var ds = (PD.days || []).filter(function (d) { return d.date !== homeDate; });
    sheet('补按哪一天的课？', '记的是上课那一天，不是今天。最多 14 天。', ds.map(function (d) {
      var n = Math.round((Date.parse(PD.date) - Date.parse(d.date)) / 86400000);
      return { label: (n === 0 ? '今天 · ' : n === 1 ? '昨天 · ' : '') + dayShort(d.date) + ' 星期' + (d.wd || wdOf(d.date)) + ' · ' + (d.classes.length ? d.classes.length + ' 班' : '没有课'), val: d.date, cls: 'ghost' };
    }).concat([{ label: '不用了', val: null, cls: 'ghost' }])).then(function (v) { if (v) { homeDate = v; drawHome(); window.scrollTo(0, 0); } });
  };
  $('extraCls').onclick = function () {
    sheet('时间表没有的班：哪一年级？', '例如今天加课、换课。', GRADES.map(function (g) { return { label: gradeName(g), val: g, cls: 'ghost' }; }).concat([{ label: '不用了', val: null, cls: 'ghost' }])).then(function (g) {
      if (!g) return;
      return sheet(gradeName(g) + '：哪一科？', '', XSUBJ.map(function (s) { return { label: s, val: s, cls: 'ghost' }; })).then(function (s) {
        if (!s) return;
        openClass({ id: g + '-' + s + '-临时', name: gradeName(g) + ' · ' + s + ' · 时间表没有的班', grades: [g], subject: s, extra: true, sure: true }, homeDate);
      });
    });
  };
  $('typeLine').onclick = function () { show('textBox', true); $('progText').value = ''; $('progText').focus(); };
  $('textCancel').onclick = function () { show('textBox', false); };
  $('textSave').onclick = function () {
    var t = $('progText').value.trim(); if (!t) { say('先打一行字。', 'bad'); return; }
    var rec = { date: homeDate, class_id: '没选班', class_name: '没选班', grades: [], subject: '', grade: '', kind: '别的', text: t, req: newReq() };
    $('textSave').disabled = true;
    run('saveProgress', [pinValue, rec]).then(function (r) {
      $('textSave').disabled = false; show('textBox', false);
      say(r && r.date === rec.date ? '✔ 记好了：' + t.slice(0, 30) : '⚠ 存到了，可是存档程序还是旧的：日期没记到。跟大C讲一声。', r && r.date === rec.date ? 'ok' : 'bad');
    }).catch(function (e) { $('textSave').disabled = false; say('没存到：' + e.message + '（再按一次）', 'bad'); });
  };
  $('recentBtn').onclick = function () { var on = $('recentBox').classList.contains('hidden'); show('recentBox', on); if (on) loadRecent(); };

  // v13 (照片对按): photos the laptop could not read (typed names) are listed first; JR taps which paper it is.
  var unkAll = false, unkOpen = false;
  function drawUnknown() {
    var list = ((PD && PD.unknown_scans) || []).filter(function (u) { return !TAGGED[u.file]; }), box = $('unkBox');
    show('unkBox', !!list.length); if (!list.length) return;
    box.innerHTML = '';
    box.appendChild(btn('📷 ' + list.length + ' 张照片电脑认不出是哪份 ' + (unkOpen ? '▴' : '› 点这里'), 'link', function () { unkOpen = !unkOpen; drawUnknown(); }));
    if (!unkOpen) return;
    box.appendChild(el('p', 'note', '点「是哪份？」告诉电脑，它就会算进那份卷。'));
    (unkAll ? list : list.slice(0, 3)).forEach(function (u) {
      var r = el('div', 'unk'); r.appendChild(el('span', '', dayShort(u.date) + ' · ' + u.file.replace(/-原图\.pdf$/, '')));
      r.appendChild(btn('是哪份？', '', function () { tagFlow(u.file, '', u.date); })); box.appendChild(r);
    });
    if (list.length > 3) box.appendChild(btn(unkAll ? '少看一点' : '还有 ' + (list.length - 3) + ' 张', 'link', function () { unkAll = !unkAll; drawUnknown(); }));
  }
  function guessGrade(name) {
    var m = /([1-6])\s*年级/.exec(name); if (m) return 'S' + m[1];
    m = /(?:\bf|form\s*|中)([1-3一二三])/i.exec(name); if (m) return 'F' + ({ '一': 1, '二': 2, '三': 3 }[m[1]] || m[1]);
    return '';
  }
  function tagFlow(file, g, day) {
    g = g === 'ask' ? '' : g || guessGrade(file);
    if (!g) return sheet('这张是几年级的？', file.replace(/-原图\.pdf$/, ''), GRADES.map(function (x) { return { label: gradeName(x), val: x, cls: 'ghost' }; }).concat([{ label: '以后再说', val: null, cls: 'ghost' }])).then(function (x) { if (x) tagFlow(file, x, day); });
    var seen = {}, opts = [];
    PROGP.forEach(function (p) {
      if (gradesOf(p).indexOf(g) < 0 || seen[p.paper_id] || (day && p.date > day)) return; seen[p.paper_id] = 1;   // printed on or before the photo's day
      opts.push({ label: dayShort(p.date) + ' · ' + (p.kind === '回头考' ? '回头考 ' + (p.short || '').slice(0, 18) : paperName(p) || p.paper_id), val: p, cls: 'ghost', d: p.date });

      var dx = Math.max(-1, Math.min(1, lv.gamma / 20)) * lim, dy = Math.max(-1, Math.min(1, lv.beta / 20)) * lim;
      g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.arc(cx, cy, R, 0, 6.3); g.fill();
      g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(cx, cy, R, 0, 6.3); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(cx, cy, c5, 0, 6.3); g.stroke();
      g.beginPath(); g.moveTo(cx - R, cy); g.lineTo(cx + R, cy); g.moveTo(cx, cy - R); g.lineTo(cx, cy + R); g.stroke();
      g.fillStyle = lv.ok ? GREEN : RED; g.beginPath(); g.arc(cx + dx, cy + dy, 5, 0, 6.3); g.fill();
    }
    var msg, good = false;
    if (now < camToastUntil) msg = camToastText;
    else if (sideways) msg = '手机转直';
    else if (!fresh || !paperOk) msg = '对准纸';
    else if (issues.length) msg = issues[0];
    else if (lv && !lv.ok) msg = '手机放平';
    else if (!steadyNow) msg = '拿稳';
    else if (camSnapping) { msg = '拍了 ✓'; good = true; }
    else if (!camAuto) { msg = '可以拍 · 按圆钮'; good = true; }
    else if (camArmed) { msg = '可以拍'; good = true; }
    else { msg = '拍了 ✓ 翻下一页'; good = true; }
    var txt = $('camStatusText');
    if (txt.textContent !== msg) txt.textContent = msg;
    $('camStatus').classList.toggle('ok', good);
  }

  // ---------- take the picture: same road as a picked photo (addCanvas -> process -> pages) ----------
  function scaleTo(src, sw, sh) {
    var s = Math.min(1, MAX_SIDE / Math.max(sw, sh)), c = document.createElement('canvas');
    c.width = Math.round(sw * s); c.height = Math.round(sh * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  function takeHi(frame, vw, vh) {      // a real still photo is sharper than a video frame; use it only if it arrives fast and has the same orientation
    // 16-Oct, JR's first real script: 3 of 6 photos were shaken (the still arrives later than the green frame; the hand had moved), and the
    // still showed MORE than the frame (a 3:4 photo vs the narrower video). So: trim the still to the video's shape, then keep it only if it is
    // about as sharp as the video frame that passed the check.
    return new Promise(function (ok) {
      var done = false, fin = function (c) { if (!done) { done = true; ok(c); } };
      setTimeout(function () { fin(frame); }, 3000);
      try {
        new ImageCapture(camTrack).takePhoto().then(fileToCanvas).then(function (c) {
          if ((c.height >= c.width) !== (vh >= vw)) return fin(frame);
          c = trimTo(c, vw / vh);
          if (c.width * c.height < frame.width * frame.height) return fin(frame);
          fin(sharpness(c) >= 0.7 * sharpness(frame) ? c : frame);
        }).catch(function () { fin(frame); });
      } catch (e) { fin(frame); }
    });
  }
  function trimTo(c, aspect) {          // centre-cut a canvas to width/height = aspect (the video's view)
    var w = c.width, h = c.height, tw = w, th = h;
    if (w / h > aspect * 1.02) tw = Math.round(h * aspect); else if (w / h < aspect / 1.02) th = Math.round(w / aspect); else return c;
    var o = document.createElement('canvas'); o.width = tw; o.height = th;
    o.getContext('2d').drawImage(c, (w - tw) / 2, (h - th) / 2, tw, th, 0, 0, tw, th);
    return o;
  }
  function sharpness(c) {               // the strongest 0.5 % of edges at 1000 px: the same measure checkPhoto() uses for '糊了'
    var B = grey(c, 1000), hist = new Uint32Array(1024), n = 0;
    for (var y = Math.floor(B.h * 0.2); y < Math.floor(B.h * 0.8); y++) for (var x = Math.floor(B.w * 0.2); x < Math.floor(B.w * 0.8); x++) {
      var k = y * B.w + x; hist[Math.min(1023, Math.round(Math.abs(B.g[k - 1] + B.g[k + 1] + B.g[k - B.w] + B.g[k + B.w] - 4 * B.g[k])))]++; n++;
    }
    var top = 0, e = 1023; while (e > 0 && top + hist[e] <= 0.005 * n) { top += hist[e]; e--; }
    return e;
  }
  function flash() {
    var f = $('camFlash'); f.style.transition = 'none'; f.style.opacity = '0.85'; void f.offsetWidth;
    f.style.transition = 'opacity .35s'; f.style.opacity = '0';
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  }
  function snap() {
    var v = $('camVideo');
    if (camSnapping || !v.videoWidth) return;
    camSnapping = true; camArmed = false; camGreenSince = 0; camLastSnap = Date.now();
    flash();
    var vw = v.videoWidth, vh = v.videoHeight, frame = scaleTo(v, vw, vh);
    var got = (camTrack && window.ImageCapture) ? takeHi(frame, vw, vh) : Promise.resolve(frame);
    got.then(function (c) {
      // 16-Oct, JR's first real script: shaken photos scored 63-71, readable ones 94+ (all 41 earlier real photos 122+). Retake, twice at most.
      if (sharpness(c) < SHARP_MIN && camRetries < 2) { camRetries++; camArmed = true; camToast('糊了，没存 · 再拍'); return; }
      camRetries = 0;
      camPending++; camCount();
      queue = queue.then(function () { return addCanvas(c); }).then(function () {
        camPending--; camCount();
        var last = pages[pages.length - 1];
        if (last && last.warn) camToast('上一页' + last.warn + ' · 可删掉重拍');
      }, function () { camPending--; camCount(); });
    }).then(function () { camSnapping = false; camLastSnap = Date.now(); camNotGreenSince = 0; });
  }
  function setMode(m) { camMode = m; $('modeOne').classList.toggle('on', m === 'one'); $('modeTwo').classList.toggle('on', m === 'two'); }

  $('liveBtn').onclick = openCamera;
  $('camShot').onclick = snap;
  $('camDone').onclick = closeCamera;
  $('modeOne').onclick = function () { setMode('one'); };
  $('modeTwo').onclick = function () { setMode('two'); };
  $('autoBtn').onclick = function () {
    camAuto = !camAuto; camGreenSince = 0;
    $('autoBtn').classList.toggle('on', camAuto); $('autoBtn').textContent = camAuto ? '● 自动拍：开' : '○ 自动拍：关';
  };

  // Test hooks for the local check only (add a picture without the camera).
  window.__jrScanAddCanvas = function (c) { return enqueue(function () { return addCanvas(c); }); };
  window.__jrScanPaper = function (c) { return paperIn(c, 0, 0, c.width, c.height); };
  window.__jrScanPages = function () { return pages.map(function (p) { return { w: p.w, h: p.h, quad: p.quad, cut: !!p.cut }; }); };

  start();
})();
</script>
