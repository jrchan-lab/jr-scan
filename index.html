<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- RELATED: apps/scanner/Code.gs (saves the PDFs to Drive), apps/scanner/README.md. v7 (15-Oct evening): ONE page, TWO homes: inside Apps Script it talks via google.script.run (camera = the phone's own camera app, because the Apps Script iframe may not use getUserMedia); on its own HTTPS address (GitHub Pages) it talks to Code.gs doPost via fetch (EXEC_URL) and gets a LIVE camera with a guide frame, a level and live checks. v4 (15-Oct): phone saves the ORIGINAL photos only; the Dell cleaner (cleaner/scan_clean.py) cuts, straightens, removes shadows and makes the 2-up. v3: fast repeat shots with the real camera, auto edge cut (OpenCV.js on demand), auto-turn, book-spread split, shadow-free clean-up, manual corner fix. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --bg:#14181d; --card:#1f252d; --ink:#f3f1ea; --soft:#a9b0b8; --accent:#e9b949; --ok:#5fbf77; --bad:#e46a5f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; font-size:18px; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:4px 0 12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button, .btn { border:0; border-radius:12px; padding:16px 18px; font-size:20px; font-weight:600; cursor:pointer; color:#14181d; background:var(--accent); flex:1 1 45%; text-align:center; }
  button.ghost, .btn.ghost { background:var(--card); color:var(--ink); border:1px solid #39424d; }
  button:disabled { opacity:.45; }
  input[type=text], input[type=password] { width:100%; font-size:20px; padding:12px; border-radius:10px; border:1px solid #39424d; background:var(--card); color:var(--ink); }
  label.check { display:flex; align-items:center; gap:10px; margin:10px 0; color:var(--soft); }
  label.check input { width:24px; height:24px; }
  .pages { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
  .page { background:var(--card); border-radius:12px; padding:8px; }
  .page img { width:100%; height:180px; object-fit:contain; background:#fff; border-radius:6px; }
  .page .n { font-weight:700; margin:4px 0; }
  .page .tools { display:flex; gap:6px; }
  .page .tools button { padding:8px 0; font-size:17px; flex:1; background:#2c343e; color:var(--ink); }
  .msg { margin:12px 0; padding:12px; border-radius:10px; background:var(--card); color:var(--soft); white-space:pre-line; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .links a { display:block; color:var(--accent); margin:8px 0; font-size:18px; word-break:break-all; }
  .hint { color:var(--soft); font-size:15px; }
  .hidden { display:none !important; }
  /* full-screen layers */
  .layer { position:fixed; inset:0; background:#000; z-index:10; display:flex; flex-direction:column; }
  .layer video, .layer canvas { flex:1; width:100%; min-height:0; object-fit:contain; touch-action:none; }
  .bar { display:flex; gap:10px; padding:12px; background:#0b0e11; align-items:center; }
  .bar button { flex:1; }
  .count { color:#fff; font-size:18px; min-width:90px; text-align:center; }
  .btn.small { font-size:16px; padding:10px; flex:1 1 100%; }
  .btn.big { font-size:24px; padding:22px 18px; flex:1 1 100%; }
  /* live camera layer */
  .cam { position:fixed; inset:0; background:#000; z-index:20; overflow:hidden; user-select:none; -webkit-user-select:none; }
  .cam video, .cam canvas { position:absolute; left:0; top:0; width:100%; height:100%; }
  .cam video { object-fit:contain; background:#000; }
  .cam canvas { pointer-events:none; }
  /* 17-Oct JR: smaller words, never over the frame; colour = state only (blackboard palette: #7fd3a0 ready, #ef7d7d not ready) */
  .cam { --camOk:#7fd3a0; --camBad:#ef7d7d; font-family:"Source Sans 3","Noto Sans SC",system-ui,sans-serif; }
  #camTop { position:absolute; left:0; right:0; top:0; display:flex; gap:6px; padding:8px 10px; padding-top:max(8px, env(safe-area-inset-top)); background:rgba(20,35,29,.82); }
  #camTop button { padding:7px 4px; font-size:15px; font-weight:600; background:#1b2f27; color:#f0efe6; border:1px solid #2f4a3e; border-radius:9px; }
  #camTop button.on { background:#f3d25a; color:#14231d; border-color:#f3d25a; }
  #camStatus { position:absolute; left:10px; right:58px; top:calc(max(8px, env(safe-area-inset-top)) + 50px); height:34px; display:flex; align-items:center; gap:8px; padding:0 12px; border-radius:17px;
    background:rgba(20,35,29,.86); border:2px solid var(--camBad); color:#f0efe6; font-size:16px; font-weight:600; pointer-events:none; white-space:nowrap; overflow:hidden; }
  #camStatus i { flex:0 0 auto; width:10px; height:10px; border-radius:50%; background:var(--camBad); }
  #camStatus.ok { border-color:var(--camOk); } #camStatus.ok i { background:var(--camOk); }
  #camBottom { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:10px; padding:14px; padding-bottom:max(14px, env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.65)); }
  #camBottom .side { flex:1; display:flex; }
  #camBottom .side.r { justify-content:flex-end; }
  #camDone { flex:0 0 auto; padding:14px 22px; background:rgba(20,24,29,.85); color:var(--ink); border:1px solid #39424d; }
  #camShot { flex:0 0 auto; width:84px; height:84px; padding:0; border-radius:50%; border:6px solid #fff; background:var(--accent); }
  #camCount { color:#fff; font-size:20px; font-weight:700; text-shadow:0 1px 4px #000; }
  #camFlash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<main>
  <h1>📄 JR 扫描</h1>

  <section id="pinBox" class="hidden">
    <p>请输入家里的密码：</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div class="row" style="margin-top:10px"><button id="pinGo">进入</button></div>
  </section>

  <section id="app" class="hidden">
    <div class="row">
      <button id="liveBtn" class="big hidden">📷 开相机拍</button>
      <label class="btn" id="camBtn">📷 拍一页<input id="cam" type="file" accept="image/*" capture="environment" class="hidden"></label>
      <label class="btn ghost">🖼 从相册选（可以一次选很多张）<input id="gallery" type="file" accept="image/*" multiple class="hidden"></label>
    </div>
    <div id="camWhy" class="msg bad hidden"><span id="camWhyText"></span>
      <div class="links"><a id="camWhyLink" href="https://jrchan-lab.github.io/jr-scan/" target="_blank" rel="noopener">https://jrchan-lab.github.io/jr-scan/</a></div>
      <div class="row"><button id="camWhyCopy" class="ghost">📋 复制网址</button></div>
    </div>
    <p class="hint">拍完一页，再按「📷 拍下一页」，一直拍下去，顺序会自动排好。手机的影子会自动淡掉。拍完可以按 ✂ 调边、↻ 转方向、⬆⬇ 换顺序、✕ 删掉。</p>

    <p class="hint">拍好后还要按「上传这份」。看到云端已上传，才代表 Drive 收到；电脑整理、小V核卷是后面的步骤，不能当作已经批改。</p>
    <span class="hidden"><input id="autocut" type="checkbox"><input id="split" type="checkbox"><input id="enhance" type="checkbox"></span>

    <div id="pages" class="pages"></div>

    <p>卷子 / 书的名字：<span class="hint">会记住，下一份不用再打。</span></p>
    <input id="name" type="text">
    <p style="margin-top:10px">学生名字：<span class="hint">扫学生的卷才填，每一份换一个；扫书不用填。</span></p>
    <input id="pupil" type="text" placeholder="例如 陈小明">
    <div class="row" style="margin-top:12px">
      <button id="make" disabled>☁ 上传这份到 Drive</button>
    </div>
    <p id="uploadState" class="hint" role="status" aria-live="polite">还没拍照片。</p>
    <div class="row" style="margin-top:10px">
      <button id="clear" class="ghost" disabled>🗑 全部清掉，重新开始</button>
    </div>

    <div id="msg" class="msg hidden"></div>
    <div id="links" class="links"></div>

    <p style="margin-top:24px">最近存的文件：</p>
    <div id="recent" class="links hint">（还没有）</div>
  </section>
  <p id="ver" class="hint" style="margin-top:28px;text-align:center"></p>
</main>

<!-- corner editor layer -->
<div id="edLayer" class="layer hidden">
  <canvas id="edCanvas"></canvas>
  <div class="bar">
    <button id="edCancel" class="ghost">取消</button>
    <button id="edFull" class="ghost">整张</button>
    <button id="edSave">✂ 切好</button>
  </div>
</div>

<!-- live camera layer -->
<div id="camLayer" class="cam hidden">
  <video id="camVideo" playsinline autoplay muted></video>
  <canvas id="camOverlay"></canvas>
  <div id="camTop">
    <button id="modeOne" class="on">一页</button>
    <button id="modeTwo">两页（书）</button>
    <button id="autoBtn" class="on">自动拍：开</button>
  </div>
  <div id="camStatus"><i></i><span id="camStatusText"></span></div>
  <div id="camFlash"></div>
  <div id="camBottom">
    <div class="side"><button id="camDone">完成</button></div>
    <button id="camShot" aria-label="拍照"></button>
    <div class="side r"><span id="camCount">已拍 0 页</span></div>
  </div>
</div>

<script>
(function () {
  // Big C fills in JR's Apps Script web-app address (https://script.google.com/macros/s/.../exec) before the page is published on GitHub Pages.
  // Inside Apps Script itself this stays unused (google.script.run is used instead).
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyxbS6gZNiC37tzVZgdoM4eJLfdWZAKOU5rGPMp-D9XRwd8DTkhQL4Braa3lYnddZ3e1A/exec';   // filled in only in the published copy (apps/scanner/publish_jr_scan.py); the address never goes into this repo
  var onGoogle = typeof google !== 'undefined' && google.script && google.script.run;
  var hasServer = !!(onGoogle || EXEC_URL);     // false = nothing to save to: the PDF is only downloaded
  var pages = [];            // {orig: dataURL, w, h, quad: [[x,y]x4] in orig px or null, cut: dataURL|null, rot: 0..3}
  var pageSerial = 0, lastSavedSignature = '', lastUploadedName = '', uploadBusy = false, uploadUnknown = false;
  function uploadSignature_() {
    return JSON.stringify([$('name').value.trim(), $('pupil').value.trim(), pages.map(function(p) {
      return [p.uid, p.rot, p.quad, p.cut ? p.cut.length : 0];
    })]);
  }
  function uploadStateText_(count, busy, saved, name, uncertain) {
    if (busy) return '正在制作并上传，请等云端回执，不要重复按。';
    if (!count) return '还没拍照片。';
    if (saved) return '云端已上传：' + name + '。电脑整理和小V核卷仍是后续步骤。';
    if (uncertain) return '上传结果待核，照片仍保留。先查最近文件，不要重复上传。';
    return '已拍 ' + count + ' 页，还没上传。请按「上传这份到 Drive」。';
  }
  function syncUploadState_() {
    $('uploadState').textContent = uploadStateText_(pages.length, uploadBusy,
      !!lastSavedSignature && uploadSignature_() === lastSavedSignature, lastUploadedName, uploadUnknown);
  }
  window.addEventListener('beforeunload', function(e) {
    if (pages.length && uploadSignature_() !== lastSavedSignature) { e.preventDefault(); e.returnValue = ''; }
  });
  $('name').addEventListener('input', syncUploadState_);
  $('pupil').addEventListener('input', syncUploadState_);
  var MAX_SIDE = 2600;
  var pinValue = '';
  var sentAt = 0, sentBase = '';   // 21-Oct: when the last save was sent, and its name, to check Drive if the reply is unreadable
  var $ = function (id) { return document.getElementById(id); };

  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  function say(text, kind) { var m = $('msg'); m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function stamp() {
    var d = new Date(), p = function (x) { return ('0' + x).slice(-2); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());   // seconds: two saves in one minute get different names
  }
  function run(fn, args) {
    if (onGoogle) return new Promise(function (ok, bad) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { bad(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    });
    if (!EXEC_URL) return Promise.reject(new Error('这个网页还没有连上 Google（服务器地址没填）。'));
    // No custom headers => text/plain => no CORS preflight; Code.gs doPost() answers {ok,result} or {ok,error}.
    return fetch(EXEC_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.text(); }, function () { throw new Error('连不上服务器，请检查网络。'); })
      .then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error('服务器的回复看不懂（可能没有设成「任何人都能用」）。'); }
        if (j && j.ok) return j.result;
        throw new Error((j && j.error) || '服务器出错了。');
      });
  }
  function loadImage(src) {
    return new Promise(function (ok, bad) { var im = new Image(); im.onload = function () { ok(im); }; im.onerror = bad; im.src = src; });
  }

  // ---------- start: PIN or straight in ----------
  function start() {
    $('name').value = savedName() || '扫描-' + stamp();
    applyCamUi();
    if (!hasServer) { show('app', true); say('这个网页还没有连上 Google（服务器地址没填）。\n可以先拍照、做 PDF，但 PDF 只会下载到这台机器，不会存到 Drive。', 'bad'); return; }
    try { pinValue = localStorage.getItem('jrScanPin') || ''; } catch (e) {}
    run('pinNeeded', []).then(function (need) {
      if (need && !pinValue) { show('pinBox', true); return; }
      enterApp();
    }).catch(function (e) { show('app', true); say('连不上：' + e.message, 'bad'); });
  }
  function enterApp() { show('pinBox', false); show('app', true); loadRecent(); }
  $('pinGo').onclick = function () {
    pinValue = $('pin').value.trim();
    run('listRecent', [pinValue]).then(function (files) {
      try { localStorage.setItem('jrScanPin', pinValue); } catch (e) {}
      enterApp(); drawRecent(files);
    }).catch(function (e) { alert(e.message); });
  };
  function loadRecent() {
    if (!hasServer) return;
    run('listRecent', [pinValue]).then(drawRecent).catch(function (e) {
      if (/密码/.test(e.message)) { try { localStorage.removeItem('jrScanPin'); } catch (x) {} show('app', false); show('pinBox', true); }
    });
  }
  function drawRecent(files) {
    var box = $('recent');
    if (!files || !files.length) { box.textContent = '（还没有）'; return; }
    box.innerHTML = '';
    files.forEach(function (f) { var a = document.createElement('a'); a.href = f.url; a.target = '_blank'; a.textContent = '📄 ' + f.name; box.appendChild(a); });
  }

  // ---------- OpenCV (only for finding the paper's corners), loaded once, on first need ----------
  var cvPromise = null;
  function getCv() {
    if (cvPromise) return cvPromise;
    cvPromise = new Promise(function (ok, bad) {
      say('第一次用「自动切边」要下载工具（约 9 MB），请等一下……');
      var s = document.createElement('script');
      s.src = 'https://docs.opencv.org/4.8.0/opencv.js'; s.async = true;
      // The OpenCV module object is "thenable"; resolving a Promise WITH it loops forever and freezes the page.
      // So resolve with a plain wrapper {cv: module}, never with the module itself.
      s.onload = function () {
        var done = false, give = function (m) { if (done) return; done = true; window.cv = m; say('切边工具好了。'); ok({ cv: m }); };
        var wait = function () {
          var m = window.cv;
          if (m && m.Mat) give(m);
          else if (m && typeof m.then === 'function') m.then(function (r) { give(r && r.Mat ? r : window.cv); });
          else if (m) m.onRuntimeInitialized = function () { give(window.cv); };
          else setTimeout(wait, 100);
        };
        wait();
      };
      s.onerror = function () { bad(new Error('切边工具下载不到')); };
      document.head.appendChild(s);
      setTimeout(function () { bad(new Error('切边工具太久没下载好')); }, 60000);
    }).catch(function (e) { cvPromise = null; throw e; });
    return cvPromise;
  }
  // Largest sensible 4-corner shape = the paper. Text is closed away first; returns corners in canvas pixels, or null
  // (null also when the paper already fills the photo: then nothing needs cutting).
  function findPaper(cv, canvas) {
    var src = cv.imread(canvas), sm = new cv.Mat(), g = new cv.Mat(), e = new cv.Mat(), cs = new cv.MatVector(), h = new cv.Mat();
    var s = Math.min(1, 640 / Math.max(canvas.width, canvas.height)), best = null, bestA = 0;
    try {
      cv.resize(src, sm, new cv.Size(Math.round(canvas.width * s), Math.round(canvas.height * s)), 0, 0, cv.INTER_AREA);
      cv.cvtColor(sm, g, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(g, g, new cv.Size(5, 5), 0);
      var k = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(11, 11));
      cv.morphologyEx(g, g, cv.MORPH_CLOSE, k); k.delete();
      cv.Canny(g, e, 30, 90);
      var k2 = cv.Mat.ones(5, 5, cv.CV_8U); cv.dilate(e, e, k2); k2.delete();
      cv.findContours(e, cs, h, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      var A = g.rows * g.cols;
      for (var i = 0; i < cs.size(); i++) {
        var c = cs.get(i), a = cv.contourArea(c);
        if (a > A * 0.25 && a < A * 0.9 && a > bestA) {
          var hull = new cv.Mat(); cv.convexHull(c, hull, false, true);
          var peri = cv.arcLength(hull, true), eps = [0.02, 0.03, 0.045, 0.06];
          for (var j = 0; j < eps.length; j++) {
            var ap = new cv.Mat(); cv.approxPolyDP(hull, ap, eps[j] * peri, true);
            if (ap.rows === 4) {
              bestA = a; best = [];
              for (var q = 0; q < 4; q++) best.push([ap.data32S[q * 2] / s, ap.data32S[q * 2 + 1] / s]);
              ap.delete(); break;
            }
            ap.delete();
          }
          hull.delete();
        }
        c.delete();
      }
    } finally { src.delete(); sm.delete(); g.delete(); e.delete(); cs.delete(); h.delete(); }
    return best ? order(best) : null;
  }
  function order(q) {   // top-left, top-right, bottom-right, bottom-left
    var s = q.slice().sort(function (a, b) { return (a[0] + a[1]) - (b[0] + b[1]); });
    var tl = s[0], br = s[3], rest = [s[1], s[2]].sort(function (a, b) { return (a[1] - a[0]) - (b[1] - b[0]); });
    return [tl, rest[0], br, rest[1]];
  }

  // ---------- perspective cut in plain JS (works even when OpenCV is not loaded) ----------
  function solve(A, b) {   // 8x8 Gaussian elimination
    var n = b.length, i, j, k;
    for (i = 0; i < n; i++) A[i].push(b[i]);
    for (i = 0; i < n; i++) {
      var p = i; for (j = i + 1; j < n; j++) if (Math.abs(A[j][i]) > Math.abs(A[p][i])) p = j;
      var t = A[i]; A[i] = A[p]; A[p] = t;
      for (j = i + 1; j < n; j++) { var f = A[j][i] / A[i][i]; for (k = i; k <= n; k++) A[j][k] -= f * A[i][k]; }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) { var sum = A[i][n]; for (j = i + 1; j < n; j++) sum -= A[i][j] * x[j]; x[i] = sum / A[i][i]; }
    return x;
  }
  function homography(from, to) {   // maps `to` (output) points onto `from` (source) points
    var A = [], b = [];
    for (var i = 0; i < 4; i++) {
      var X = to[i][0], Y = to[i][1], x = from[i][0], y = from[i][1];
      A.push([X, Y, 1, 0, 0, 0, -X * x, -Y * x]); b.push(x);
      A.push([0, 0, 0, X, Y, 1, -X * y, -Y * y]); b.push(y);
    }
    var h = solve(A, b); h.push(1); return h;
  }
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function cutPage(page) {
    return loadImage(page.orig).then(function (im) { page.cut = warp(im, page.quad).toDataURL('image/jpeg', 0.9); });
  }
  function warp(im, q) {
    {
      var W = Math.round(Math.max(dist(q[0], q[1]), dist(q[3], q[2])));
      var H = Math.round(Math.max(dist(q[0], q[3]), dist(q[1], q[2])));
      var s = Math.min(1, MAX_SIDE / Math.max(W, H)); W = Math.round(W * s); H = Math.round(H * s);
      var sc = document.createElement('canvas'); sc.width = im.naturalWidth || im.width; sc.height = im.naturalHeight || im.height;
      var sg = sc.getContext('2d'); sg.drawImage(im, 0, 0);
      var sd = sg.getImageData(0, 0, sc.width, sc.height).data, sw = sc.width, shh = sc.height;
      var oc = document.createElement('canvas'); oc.width = W; oc.height = H;
      var og = oc.getContext('2d'), out = og.createImageData(W, H), od = out.data;
      var h = homography(q, [[0, 0], [W, 0], [W, H], [0, H]]);
      for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
        var d = h[6] * x + h[7] * y + 1, u = (h[0] * x + h[1] * y + h[2]) / d, v = (h[3] * x + h[4] * y + h[5]) / d;

      if (sharpness(c) < SHARP_MIN && camRetries < 2) { camRetries++; camArmed = true; camToast('糊了，没存 · 再拍'); return; }
      camRetries = 0;
      camPending++; camCount();
      queue = queue.then(function () { return addCanvas(c); }).then(function () {
        camPending--; camCount();
        var last = pages[pages.length - 1];
        if (last && last.warn) camToast('上一页' + last.warn + ' · 可删掉重拍');
      }, function () { camPending--; camCount(); });
    }).then(function () { camSnapping = false; camLastSnap = Date.now(); camNotGreenSince = 0; });
  }
  function setMode(m) { camMode = m; $('modeOne').classList.toggle('on', m === 'one'); $('modeTwo').classList.toggle('on', m === 'two'); }

  $('liveBtn').onclick = openCamera;
  $('camShot').onclick = snap;
  $('camDone').onclick = closeCamera;
  $('modeOne').onclick = function () { setMode('one'); };
  $('modeTwo').onclick = function () { setMode('two'); };
  $('autoBtn').onclick = function () {
    camAuto = !camAuto; camGreenSince = 0;
    $('autoBtn').classList.toggle('on', camAuto); $('autoBtn').textContent = camAuto ? '自动拍：开' : '自动拍：关';
  };

  // Test hooks for the local check only (add a picture without the camera).
  window.__jrScanAddCanvas = function (c) { return enqueue(function () { return addCanvas(c); }); };
  window.__jrScanPaper = function (c) { return paperIn(c, 0, 0, c.width, c.height); };
  window.__jrScanPages = function () { return pages.map(function (p) { return { w: p.w, h: p.h, quad: p.quad, cut: !!p.cut }; }); };

  start();
})();
</script>
